<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Фотография храма не загружена">
  <title>Фотография храма не загружена</title>
  <desc>Orthodox Routes, заглушка вместо фотографии. Тона задаются извне через CSS-переменные ph-bg, ph-drum, ph-dome; набор выбирается детерминированно по идентификатору храма (DS V2 параграф 9.3). preserveAspectRatio xMidYMax meet обязателен: фигура всегда прижата к нижнему краю и никогда не растягивается. При вертикальном центрировании окна барабана отрываются от низа.</desc>

  <rect width="240" height="200" fill="var(--ph-bg, #E6EBEF)"/>

  <!-- Барабан: совпадает с куполом по левому и правому краю, 64 и 176 -->
  <rect x="64" y="132" width="112" height="68" fill="var(--ph-drum, #CFD9E1)"/>

  <!-- Купол: боковые стенки выходят из барабана вертикально, силуэт читается как один объём -->
  <path d="M64 132 C64 114 68 102 78 88 C92 68 109 56 120 48 C131 56 148 68 162 88 C172 102 176 114 176 132 Z"
        fill="var(--ph-dome, #AEBCC9)"/>
  <circle cx="120" cy="49" r="3.6" fill="var(--ph-dome, #AEBCC9)"/>

  <!-- Восьмиконечный крест: пропорции от высоты 34. Титло на 15 процентах сверху, средняя перекладина на 35, подножие на 74 и наклонено левым концом вверх -->
  <g fill="var(--ph-dome, #AEBCC9)">
    <rect x="118.35" y="14" width="3.3" height="34"/>
    <rect x="114.25" y="19.1" width="11.5" height="2.6"/>
    <rect x="109" y="25.9" width="22" height="3.3"/>
    <path d="M112.8 37 L127.2 41.4 L127.2 44.3 L112.8 39.9 Z"/>
  </g>

  <!-- Окна барабана: пять, шаг 22, центральное по оси купола и креста -->
  <g fill="var(--ph-bg, #E6EBEF)">
    <path d="M71 200v-45a5 5 0 0 1 10 0v45Z"/>
    <path d="M93 200v-45a5 5 0 0 1 10 0v45Z"/>
    <path d="M115 200v-45a5 5 0 0 1 10 0v45Z"/>
    <path d="M137 200v-45a5 5 0 0 1 10 0v45Z"/>
    <path d="M159 200v-45a5 5 0 0 1 10 0v45Z"/>
  </g>
</svg>
