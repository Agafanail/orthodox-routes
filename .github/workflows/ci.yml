name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  database-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Core stack
        run: npm run auth:start

      - name: Rebuild database from migrations
        run: npm run db:reset

      - name: Verify representative Core upgrade
        run: npm run test:core-upgrade

      - name: Stop local Core stack
        if: always()
        run: npm run auth:stop

  local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Auth
        run: npm run auth:start

      - name: Run focused Auth tests
        run: npm run test:auth

      - name: Verify local passwordless Auth integration
        run: npm run auth:verify

      - name: Verify account and eligibility foundation
        run: npm run test:account

      - name: Verify phone verification foundation
        run: npm run test:phone

      - name: Verify contextual registration drafts
        run: npm run test:drafts

      - name: Verify server-owned transport foundation
        run: npm run test:transport

      - name: Verify ride agreements and disclosure
        run: npm run test:agreements

      - name: Stop local Auth
        if: always()
        run: npm run auth:stop

  core-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Core stack
        run: npm run auth:start

      - name: Rebuild database from migrations
        run: npm run db:reset

      - name: Run Core browser regression
        run: npm run test:e2e

      - name: Stop local Core stack
        if: always()
        run: npm run auth:stop
