name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  database-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local database
        run: npm run db:start

      - name: Rebuild database from migrations
        run: npm run db:reset

      - name: Stop local database
        if: always()
        run: npm run db:stop

  local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Auth
        run: npm run auth:start

      - name: Run focused Auth tests
        run: npm run test:auth

      - name: Verify local passwordless Auth integration
        run: npm run auth:verify

      - name: Verify account and eligibility foundation
        run: npm run test:account

      - name: Stop local Auth
        if: always()
        run: npm run auth:stop
